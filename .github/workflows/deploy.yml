name: Deploy AccountingApp

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase configuration
        env:
          VITE_ENV_FILE: ${{ secrets.VITE_ENV_FILE }}
        run: |
          if [ -z "$VITE_ENV_FILE" ]; then
            echo "Add the VITE_ENV_FILE repository secret"
            exit 1
          fi
          printf '%s\n' "$VITE_ENV_FILE" > .env.production

      - name: Build
        run: npm run build -- --base=/AccountingApp/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
